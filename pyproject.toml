[project]
name = "mcpaudit"
version = "0.1.0"
description = "Security scanner and public trust registry for Model Context Protocol servers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Krishnaa R K", email = "rengakrishnaa@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "security", "llm", "prompt-injection"]

# Deliberately empty. The scanner runs with nothing but the standard library,
# so `git clone && python -m mcpaudit demo` works on any machine with Python.
dependencies = []

[project.optional-dependencies]
# httpx is only needed to scan remote (HTTP transport) servers faster; the
# stdlib fallback in client.py handles it otherwise.
http = ["httpx>=0.27"]
# The LLM judge tier. Off by default — the public registry is generated
# without it, which is why it costs nothing to run.
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mcpaudit = "mcpaudit.cli:main"

[project.urls]
Homepage = "https://rengakrishnaa.github.io/mcpaudit/"
Source = "https://github.com/rengakrishnaa/mcpaudit"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcpaudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
